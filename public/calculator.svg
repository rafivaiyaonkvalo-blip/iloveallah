<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#334155" stroke-width="8"/>

  <!-- Calculator Screen -->
  <rect x="72" y="72" width="368" height="96" rx="24" fill="#020617" stroke="#1e293b" stroke-width="4"/>
  <!-- AI Chip Badge on LCD -->
  <rect x="88" y="88" width="46" height="24" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <text x="111" y="105" font-family="sans-serif" font-size="14" font-weight="900" fill="#34d399" text-anchor="middle">AI</text>
  <text x="408" y="142" font-family="monospace, sans-serif" font-size="52" font-weight="bold" fill="#f8fafc" text-anchor="end">1234</text>

  <!-- Button Grid -->
  <!-- Row 1: AC (Red/Rose), +/-, %, ÷ (Amber) -->
  <rect x="72" y="196" width="76" height="56" rx="16" fill="#47151f"/>
  <text x="110" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fb7185" text-anchor="middle">AC</text>

  <rect x="169" y="196" width="76" height="56" rx="16" fill="#334155"/>
  <text x="207" y="235" font-family="sans-serif" font-size="26" font-weight="bold" fill="#94a3b8" text-anchor="middle">±</text>

  <rect x="266" y="196" width="76" height="56" rx="16" fill="#334155"/>
  <text x="304" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle">%</text>

  <rect x="364" y="196" width="76" height="56" rx="16" fill="url(#amberGrad)"/>
  <text x="402" y="236" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2: 7, 8, 9, × -->
  <rect x="72" y="268" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="110" y="307" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">7</text>

  <rect x="169" y="268" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="207" y="307" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">8</text>

  <rect x="266" y="268" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="304" y="307" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">9</text>

  <rect x="364" y="268" width="76" height="56" rx="16" fill="url(#amberGrad)"/>
  <text x="402" y="308" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3: 4, 5, 6, - -->
  <rect x="72" y="340" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="110" y="379" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">4</text>

  <rect x="169" y="340" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="207" y="379" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">5</text>

  <rect x="266" y="340" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="304" y="379" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">6</text>

  <rect x="364" y="340" width="76" height="56" rx="16" fill="url(#amberGrad)"/>
  <text x="402" y="380" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <!-- Row 4: 1, 2, 3, + -->
  <rect x="72" y="412" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="110" y="451" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">1</text>

  <rect x="169" y="412" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="207" y="451" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">2</text>

  <rect x="266" y="412" width="76" height="56" rx="16" fill="#1e293b"/>
  <text x="304" y="451" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f1f5f9" text-anchor="middle">3</text>

  <rect x="364" y="412" width="76" height="56" rx="16" fill="url(#emeraldGrad)"/>
  <text x="402" y="452" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">=</text>
</svg>
